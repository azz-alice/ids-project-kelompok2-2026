<!doctype html>
<html lang="id" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Pengunjung</title>
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("ids-theme"); } catch {}
      const preferred = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = saved === "dark" || saved === "light" ? saved : preferred;
    })();
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <main class="halaman">
    <header class="sesi" id="sesi" data-state="memuat">
      <div class="sesi-baris">
        <div class="tiket">
          <span class="label">Ticket</span>
          <span class="tiket-kode" id="tiket">—</span>
        </div>
        <div class="sesi-kanan">
          <span class="status-sesi" id="status-sesi">Memeriksa sesi</span>
          <button class="tombol-tema" id="theme-toggle" type="button" aria-label="Ganti ke tema gelap" title="Ganti ke tema gelap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle class="tema-cincin" cx="12" cy="12" r="8.25" />
              <path class="tema-separuh" d="M12 3.75a8.25 8.25 0 0 0 0 16.5z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="sesi-selesai" id="sesi-selesai" hidden>
        <span id="pesan-sesi"></span>
        <button class="tombol-sekunder" id="sesi-baru" type="button">Mulai sesi baru</button>
      </div>
    </header>

    <section class="pilihan" aria-labelledby="judul-pilihan">
      <h1 id="judul-pilihan">Pilih aktivitas</h1>
      <div class="daftar-pilihan">
        <button class="pilihan-item" type="button" data-scenario="volume_spike" disabled>
          <span class="pilihan-judul">Kenaikan volume traffic</span>
          <span class="pilihan-ket">Kirim burst 30 request dengan protokol acak (TCP/UDP/HTTP).</span>
        </button>
        <button class="pilihan-item" type="button" data-scenario="payload_size_variation" disabled>
          <span class="pilihan-judul">Perbedaan ukuran data</span>
          <span class="pilihan-ket">Kirim burst 30 request variasi ukuran data 64 B sampai 16 KB.</span>
        </button>
        <button class="pilihan-item" type="button" data-scenario="request_frequency" disabled>
          <span class="pilihan-judul">Peningkatan frekuensi request</span>
          <span class="pilihan-ket">Kirim burst 30 request frekuensi tinggi dengan protokol acak.</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
